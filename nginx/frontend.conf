server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use variable-based upstream so nginx re-resolves backend via Docker DNS
    set $backend_upstream http://backend:8000;

    # Docker embedded DNS (prevents hard-fail if backend name resolves late)
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_static on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss image/svg+xml;

    # Brotli compression
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types text/plain text/css text/xml text/javascript 
                 application/json application/javascript application/xml+rss image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Disable caching for SPA shell (prevents stale bundles after deploy)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # Main location - SPA routing
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # v2 asset alias (keep v1 /assets bundles intact)
    location ^~ /assets/01home/ {
        alias /usr/share/nginx/html/v2/assets/01home/;
    }
    location ^~ /assets/02gamedash/ {
        alias /usr/share/nginx/html/v2/assets/02gamedash/;
    }
    location ^~ /assets/03dice/ {
        alias /usr/share/nginx/html/v2/assets/03dice/;
    }
    location ^~ /assets/04lotto/ {
        alias /usr/share/nginx/html/v2/assets/04lotto/;
    }
    location ^~ /assets/05valut/ {
        alias /usr/share/nginx/html/v2/assets/05valut/;
    }
    location ^~ /assets/06shop/ {
        alias /usr/share/nginx/html/v2/assets/06shop/;
    }
    location ^~ /assets/07mission/ {
        alias /usr/share/nginx/html/v2/assets/07mission/;
    }
    location ^~ /assets/08inventory/ {
        alias /usr/share/nginx/html/v2/assets/08inventory/;
    }
    location ^~ /assets/arch/ {
        alias /usr/share/nginx/html/v2/assets/arch/;
    }
    location ^~ /assets/png/ {
        alias /usr/share/nginx/html/v2/assets/png/;
    }
    location ^~ /assets/svg/ {
        alias /usr/share/nginx/html/v2/assets/svg/;
    }

    # API reverse proxy (same-origin) for Docker frontend access via :3000
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
