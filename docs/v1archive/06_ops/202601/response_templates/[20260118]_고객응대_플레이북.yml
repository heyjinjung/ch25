version: "v1.0 (2026-01-18)"
target: "\"충전해야 출금되나요?\"라며 버티는 체리피커 유저 대응"
purpose: "무과금 유저의 심리적 장벽을 낮추고, 최소 입금(1만원)을 유도하여 실유저로 전환"
principles:
  - principle: "감정적 공감"
    description: "\"먹튀 걱정\"을 인정해주되, 시스템의 '자동화'를 강조하여 신뢰 형성."
  - principle: "명확한 교환"
    description: "\"무료 혜택\"에 대한 대가는 \"최소한의 인증(입금)\"임을 명시."
  - principle: "퇴로 제공"
    description: "\"입금 -> 출금\" 프로세스가 즉시 가능함을 보장."

scenarios:
  - id: "A"
    situation: "충전해야 출금되는거 아닌가요? (먹튀 의심/버티기)"
    user_psychology: "\"내 돈 1만원 넣었다가 못 받으면 어떡하지?\", \"꽁머니만 받고 싶은데 귀찮게 하네\""
    key_response: "입금액은 '수수료'가 아니라 **'본인 계좌 인증을 위한 절차'**이며, **'전액 그대로 환전 가능함'**을 강조."
    responses:
      step_1_soft: |
        덕환님ㅠㅠ 저희가 1만원 벌자고 
        회원님 소중한 인연을 끊겠나영 😭
        지금 코드지갑 있으시니까
        입플두 받구 겜도 하시고
        포인트도 같이 챙기시면 좋져
      step_2_hard: |
        이렇게 하시면 돼요!
        1만 충전 (이건 인증용)+ 1만 입플받고
        쿱 1만 추가로 
        1 넣구 2 챙기시는겁니당
        지금 안 찾아가시면 이 포인트 곧 소멸돼요 ㅠㅠ 아깝잖아요
      step_3_takeaway: |
        오빠, 다른 분들은 이미 다 환전해가셔서 
        제가 더 챙겨드릴 예산이 얼마 안 남았어요ㅠㅠ
        딱 30분만 기다려보고, 진행 안 하시면 
        다음 대기자분께 이 혜택 넘겨드릴까용 ㅠㅠ 

  - id: "B"
    situation: "돈이 없어요 / 나중에 할게요"
    user_psychology: "귀찮거나, 당장 돈 쓰기 싫음."
    key_response: "**'손실 회피(Loss Aversion)'** 자극. 지금 안 하면 사라진다는 긴급성 부여."
    responses:
      recommendation: |
        헉.. 이거 오늘 12시까지만 유효한 코드라서요..
        나중에는 이 혜택(12,000원) 다시 못 받으세요
        1만하시구 입플에 혜택까지 바로 총 2만원 넘게 가져가시는 건데..
        진짜 안 하실 거예요? ㅠ ? 

  - id: "C"
    situation: "그냥 포인트만 주세요 (강성 체리피커)"
    user_psychology: "절대 입금 안 하겠다."
    key_response: "단호하게 선 긋기 (Bad User 필터링)."
    responses:
      recommendation: |
        죄송해요 회원님 😭 
        저희도 시스템이라, 입금 내역이 0원이면 
        전산에서 송금 버튼이 안 눌러져요 ㅠㅠ 
        제가 드리고 싶어도 시스템이 막혀있어서 방법이 없네요 ㅠ
        입플받구 해주시면 제가 바로 처리해드릴게요!

custom_examples:
  - target_user: "김덕환(덕구간다)"
    situation: "충해야출금되는거아닌가요? (전형적인 의심+간보기)"
    script: |
      덕화님! 지금 가지고 계신 포인트는 '현금'이랑 똑같은 건데, 
      저희가 아무한테나 막 송금해드릴 순 없잖아요? 
      (보이스피싱 계좌일 수도 있고ㅠㅠ)

      그래서 진짜 덕화님 계좌 맞는지 확인하려고 
      딱 1만원만 입금 기록 남겨주시면 됩니다.

      1만 충하셔서 노시구 
      입플이랑 혜택까지 다 받으시면 훨씩 이득이세요
      제 이름 걸고 약속드릴게요. 
      지금 바로 인증하고 2만원 넘게 챙겨가세요!
