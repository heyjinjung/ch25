    # ============================================================================
    ActivityRecordRequest:
      type: object
      properties:
        event_type:
          type: string
        event_id:
          type: string
        value:
          type: integer
        meta_json:
          type: object
          additionalProperties: true

    ActivityRecordResponse:
      type: object
      properties:
        user_id:
          type: integer
        updated_at:
          type: string
          format: date-time

    # ============================================================================
