    TelegramAuthRequest:
      type: object
      properties:
        init_data:
          type: string
        start_param:
          type: string

    TelegramAuthResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        is_new_user:
          type: boolean
        linked_to_existing:
          type: boolean
        user:
          $ref: "#/components/schemas/UserSummary"

    TelegramLinkTokenResponse:
      type: object
      properties:
        expires_at_utc:
          type: string
          format: date-time
        start_param:
          type: string
        open_url:
          type: string

    TelegramUnlinkRequest:
      type: object
      properties:
        init_data:
          type: string

    # ============================================================================
