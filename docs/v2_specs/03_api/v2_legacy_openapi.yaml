components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ============================================================================
    # Generic
    # ============================================================================
    GenericObject:
      type: object
      additionalProperties: true

    # ============================================================================
    # System
    # ============================================================================
    HealthResponse:
      type: object
      properties:
        status:
          type: string

    TodayFeatureResponse:
      type: object
      properties:
        feature_type:
          type: string
          nullable: true
        user_id:
          type: integer
          nullable: true

    # ============================================================================
    # Auth
    # ============================================================================
    AuthTokenRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
        external_id:
          type: string
        password:
          type: string

    AuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        user:
          $ref: "#/components/schemas/UserSummary"

    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean

    UserSummary:
      type: object
      properties:
        id:
          type: integer
        external_id:
          type: string
        nickname:
          type: string
        status:
          type: string
        level:
          type: integer
        segment:
          type: string
        telegram_id:
          type: integer
        login_streak:
          type: integer

    DevLoginRequest:
      type: object
      properties:
        external_id:
          type: string
        nickname:
          type: string
        create_if_missing:
          type: boolean

    # ============================================================================
    # User
    # ============================================================================
    UserMeResponse:
      type: object
      properties:
        id:
          type: integer
        nickname:
          type: string

    UserBalanceResponse:
      type: object
      properties:
        vault_locked:
          type: integer
        vault_available:
          type: integer

    # ============================================================================
    # Vault
    # ============================================================================
    VaultStatusResponse:
      type: object
      properties:
        eligible:
          type: boolean
        vaultBalance:
          type: integer
        lockedBalance:
          type: integer
        availableBalance:
          type: integer
        ticketCount:
          type: integer
        is_golden_hour_active:
          type: boolean
        golden_hour_multiplier:
          type: number
        golden_hour_remaining_seconds:
          type: integer
        showModalOverride:
          type: string
          nullable: true
        segment:
          type: string
          nullable: true
        daily_play_count:
          type: integer
        daily_play_target:
          type: integer
        daily_vault_spent:
          type: integer
        daily_vault_spent_target:
          type: integer
        daily_deposit_confirmed:
          type: boolean
        withdrawal_count:
          type: integer
        deposit_status:
          type: string
        vault_max_limit:
          type: integer
        benefits_suspended:
          type: boolean

    VaultWithdrawRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
        protocol_key:
          type: string
          nullable: true

    VaultWithdrawResponse:
      type: object
      properties:
        request_id:
          type: integer
        status:
          type: string
        amount:
          type: integer
        balance_after:
          type: integer

    # ============================================================================
    # Game - Roulette
    # ============================================================================
    RouletteStatusResponse:
      type: object
      properties:
        config_id:
          type: integer
        name:
          type: string
        max_daily_spins:
          type: integer
        today_spins:
          type: integer
        remaining_spins:
          type: integer
        token_type:
          type: string
        token_balance:
          type: integer
        segments:
          type: array
          items:
            $ref: "#/components/schemas/RouletteSegment"
        feature_type:
          type: string

    RouletteSegment:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        reward_type:
          type: string
        reward_amount:
          type: integer
        slot_index:
          type: integer
        is_fever_reward:
          type: boolean

    RoulettePlayRequest:
      type: object
      properties:
        ticket_type:
          type: string
        bet_multiplier:
          type: integer

    # ============================================================================
    # Game - Dice
    # ============================================================================
    DiceStatusResponse:
      type: object
      properties:
        config_id:
          type: integer
        name:
          type: string
        max_daily_plays:
          type: integer
        today_plays:
          type: integer
        remaining_plays:
          type: integer
        token_type:
          type: string
        token_balance:
          type: integer
        feature_type:
          type: string
        event_active:
          type: boolean
        event_plays_done:
          type: integer
          nullable: true
        event_plays_max:
          type: integer
          nullable: true
        event_ineligible_reason:
          type: string
          nullable: true

    DicePlayRequest:
      type: object
      properties:
        bet_amount:
          type: integer
        prediction:
          type: string

    DiceDoubleUpRequest:
      type: object
      properties:
        previous_game_id:
          type: string
        choice:
          type: string

    DiceDoubleUpResponse:
      type: object
      properties:
        result:
          type: string
        final_amount:
          type: integer
        is_bust:
          type: boolean

    # ============================================================================
    # Game - Lottery
    # ============================================================================
    LotteryStatusResponse:
      type: object
      properties:
        config_id:
          type: integer
        name:
          type: string
        max_daily_tickets:
          type: integer
        today_tickets:
          type: integer
        remaining_tickets:
          type: integer
        token_type:
          type: string
        token_balance:
          type: integer
        prizes:
          type: array
          items:
            $ref: "#/components/schemas/LotteryPrize"
        feature_type:
          type: string
        collectionProgress:
          type: object
          additionalProperties:
            type: integer

    LotteryPrize:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        reward_type:
          type: string
        reward_amount:
          type: integer
        stock:
          type: integer
          nullable: true
        is_active:
          type: boolean
        weight:
          type: number

    LotteryPlayRequest:
      type: object
      properties:
        ticket_type:
          type: string
        selection_numbers:
          type: array
          items:
            type: integer

    CraftRequest:
      type: object
      properties:
        target_token_type:
          type: string

    CraftResponse:
      type: object
      properties:
        result:
          type: string
        reward_token:
          type: string
        reward_amount:
          type: integer
        used_token:
          type: string
        used_amount:
          type: integer

    # ============================================================================
    # Game - Common
    # ============================================================================
    GamePlayResponse:
      type: object
      properties:
        result:
          type: string
        game_data:
          type: object
          additionalProperties: true
        vault_earn:
          type: integer
        season_pass:
          type: object
          nullable: true
        streak_info:
          type: object
          nullable: true
        fever_gauge:
          type: object
          nullable: true
        next_action_available:
          type: array
          items:
            type: string

    # ============================================================================
    # Mission
    # ============================================================================
    MissionDto:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        reward_type:
          type: string
        reward_amount:
          type: integer
        progress:
          type: integer
        target:
          type: integer
        is_completed:
          type: boolean
        is_claimed:
          type: boolean

    StreakInfoDto:
      type: object
      properties:
        current_streak:
          type: integer
        today_completed:
          type: boolean
        last_completed_date:
          type: string
          nullable: true
        claimable_rewards:
          type: array
          items:
            type: integer

    StreakRuleDto:
      type: object
      properties:
        day:
          type: integer
        enabled:
          type: boolean
        grants:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              token_type:
                type: string
              item_type:
                type: string
              amount:
                type: integer

    MissionListResponse:
      type: object
      properties:
        missions:
          type: array
          items:
            $ref: "#/components/schemas/MissionDto"
        streak_info:
          $ref: "#/components/schemas/StreakInfoDto"

    ClaimMissionResponse:
      type: object
      properties:
        success:
          type: boolean
        reward_type:
          type: string
        amount:
          type: integer

    ClaimStreakResponse:
      type: object
      properties:
        success:
          type: boolean
        streak_info:
          $ref: "#/components/schemas/StreakInfoDto"
        grants:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              token_type:
                type: string
              item_type:
                type: string
              amount:
                type: integer

    # ============================================================================
    # Inventory
    # ============================================================================
    InventoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              item_type:
                type: string
              quantity:
                type: integer
              created_at:
                type: string
                format: date-time
        wallet:
          type: object
          additionalProperties: true

    InventoryUseRequest:
      type: object
      properties:
        item_type:
          type: string
        amount:
          type: integer

    # ============================================================================
    # Shop
    # ============================================================================
    ShopProductDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        cost_type:
          type: string
          enum: [VAULT, DIAMOND]
        cost_amount:
          type: integer
        reward_type:
          type: string
        reward_amount:
          type: integer
        is_active:
          type: boolean
        display_order:
          type: integer

    ShopPurchaseRequest:
      type: object
      properties:
        sku:
          type: string

    ShopPurchaseResponse:
      type: object
      properties:
        order_id:
          type: string
        sku:
          type: string
        reward_type:
          type: string
        reward_amount:
          type: integer

    # ============================================================================
    # TeamBattle
    # ============================================================================
    TeamJoinRequest:
      type: object
      properties:
        team_id:
          type: integer

    # ============================================================================
    # Inbox
    # ============================================================================
