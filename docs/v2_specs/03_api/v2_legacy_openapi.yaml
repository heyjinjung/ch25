      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              message_id:
                type: integer
              title:
                type: string
              content:
                type: string
              is_read:
                type: boolean
              read_at:
                type: string
                format: date-time
                nullable: true
              created_at:
                type: string
                format: date-time
        unread_count:
          type: integer

    InboxReadRequest:
      type: object
      properties:
        inbox_ids:
          type: array
          items:
            type: integer

    InboxReadResponse:
      type: object
      properties:
        marked_count:
          type: integer
        remaining_unread:
          type: integer

    # ============================================================================
