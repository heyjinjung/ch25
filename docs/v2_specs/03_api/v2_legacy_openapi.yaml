          type: boolean
        experiment_group:
          type: string
        reward_type:
          type: string
        reward_amount:
          type: integer
        capped_amount:
          type: integer
        cmax:
          type: integer
        predicted_ltv:
          type: integer
        roi_percent:
          type: number
        meta:
          type: object
          additionalProperties: true

    GoldenReengagementRequest:
      type: object
      properties:
        reason:
          type: string
        channel:
          type: string

    GoldenReengagementResponse:
      type: object
      properties:
        queued:
