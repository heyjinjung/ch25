    # ============================================================================
    TicketZeroStatusResponse:
      type: object
      properties:
        bailout_available:
          type: boolean

    TicketZeroBailoutResponse:
      type: object
      properties:
        granted:
          type: boolean
        ticket_type:
          type: string
        ticket_amount:
          type: integer

