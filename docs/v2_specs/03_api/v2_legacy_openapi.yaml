# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2021-09-28
# [최종 검토일: 2026-01-30]
# [정책 최신화 필요 여부: 🟡] 🟡 [정합성 검토 필요] Vault 응답에 `available` 계열 필드가 포함되어 단일 SoT(`vault_locked_balance`)와 표현 충돌 가능. Deprecated/별칭 여부를 문서/스키마로 명시 필요.
openapi: 3.0.3
info:
  title: XMAS Event System V2 API
  version: v2.0
  description: |
    V2 API 전체 스웨거(OpenAPI) 스펙.
    최신 프론트엔드 구현 기준으로 업데이트됨.
    근거: docs/v2_specs/03_api/*.md, src/v2/api/*.ts
servers:
  - url: /

security:
  - bearerAuth: []

tags:
  - name: System
    description: 시스템 헬스 체크 및 기능 조회
  - name: Auth
    description: 인증 및 토큰 관리
  - name: User
    description: 유저 정보 조회
  - name: Vault
    description: 금고 (Vault) 관련 API
  - name: Game
    description: 룰렛, 주사위, 복권 게임 API
  - name: Mission
    description: 미션 및 스트릭 관련 API
  - name: Inventory
    description: 인벤토리 및 아이템 관리
  - name: Shop
    description: 상점 API
  - name: TeamBattle
    description: 팀 배틀 API
  - name: Survey
    description: 설문 API
  - name: Feed
    description: 피드 API
  - name: Inbox
    description: 인박스 메시지 API
  - name: TicketZero
    description: 티켓 제로 구제 API
  - name: Golden
    description: 골든 개입 및 리인게이지먼트 API
  - name: Telegram
    description: 텔레그램 연동 API
  - name: NewUser
    description: 신규 유저 관련 API
  - name: Activity
    description: 활동 기록 API
  - name: UiConfig
    description: UI 설정 API
  - name: Dev
    description: 개발 환경 전용 API
  - name: Admin
    description: 관리자 API
  - name: AdminUsers
    description: 관리자 - 유저 관리
  - name: AdminEconomy
    description: 관리자 - 경제 관리 (입금, 출금, 금고)
  - name: AdminShop
    description: 관리자 - 상점 관리
  - name: AdminGame
    description: 관리자 - 게임 설정
  - name: AdminInventory
    description: 관리자 - 인벤토리/티켓 관리
  - name: AdminSegment
    description: 관리자 - 세그먼트 관리
  - name: AdminMarketing
    description: 관리자 - 마케팅 (메시지, 설문)
  - name: AdminOps
    description: 관리자 - 운영 대시보드

paths:
  # ============================================================================
  # System
  # ============================================================================
  /api/v2/health:
    get:
      tags: [System]
      summary: 헬스 체크
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v2/health/db:
    get:
      tags: [System]
      summary: DB 헬스 체크
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v2/today-feature:
    get:
      tags: [System]
      summary: 오늘의 기능
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayFeatureResponse"

  /api/v2/metrics:
    get:
      tags: [System]
      summary: 메트릭
      responses:
        "200":
          description: OK

  # ============================================================================
  # Auth
  # ============================================================================
  /api/v2/auth/token:
    post:
      tags: [Auth]
      summary: 토큰 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"

  /api/v2/auth/login:
    post:
      tags: [Auth]
      summary: 로그인 (alias)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"

  /api/v2/auth/refresh:
    post:
      tags: [Auth]
      summary: 토큰 갱신
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"

  /api/v2/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"

  # ============================================================================
  # User
  # ============================================================================
  /api/v2/user/me:
    get:
      tags: [User]
      summary: 내 정보
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"

  /api/v2/user/balance:
    get:
      tags: [User]
      summary: 내 잔액
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBalanceResponse"

  # ============================================================================
  # Vault
  # ============================================================================
  /api/v2/vault/status:
    get:
      tags: [Vault]
      summary: 금고 상태 조회
      description: |
        금고 잔액, 출금 가능액, 골든아워 상태, 출금 조건 등을 조회합니다.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStatusResponse"

  /api/v2/vault/withdraw:
    post:
      tags: [Vault]
      summary: 금고 출금 신청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultWithdrawRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultWithdrawResponse"

  # ============================================================================
  # Game - Roulette
  # ============================================================================
  /api/v2/roulette/status:
    get:
      tags: [Game]
      summary: 룰렛 상태 조회
      parameters:
        - in: query
          name: ticket_type
          schema:
            type: string
          description: 티켓 타입 (ROULETTE_TICKET, GOLD_KEY_TICKET 등)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouletteStatusResponse"

  /api/v2/roulette/play:
    post:
      tags: [Game]
      summary: 룰렛 플레이
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoulettePlayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePlayResponse"

  # ============================================================================
  # Game - Dice
  # ============================================================================
  /api/v2/dice/status:
    get:
      tags: [Game]
      summary: 주사위 상태 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiceStatusResponse"

  /api/v2/dice/play:
    post:
      tags: [Game]
      summary: 주사위 플레이
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DicePlayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePlayResponse"

  /api/v2/dice/double-up:
    post:
      tags: [Game]
      summary: 주사위 더블업
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiceDoubleUpRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiceDoubleUpResponse"

  # ============================================================================
  # Game - Lottery
  # ============================================================================
  /api/v2/lottery/status:
    get:
      tags: [Game]
      summary: 복권 상태 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotteryStatusResponse"

  /api/v2/lottery/play:
    post:
      tags: [Game]
      summary: 복권 플레이
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotteryPlayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePlayResponse"

  /api/v2/exchange/craft:
    post:
      tags: [Game]
      summary: 퍼즐 합체 제작
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CraftRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CraftResponse"

  # ============================================================================
  # Mission
  # ============================================================================
  /api/v2/mission/:
    get:
      tags: [Mission]
      summary: 미션 목록 및 진행도 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionListResponse"

  /api/v2/mission/{mission_id}/claim:
    post:
      tags: [Mission]
      summary: 미션 보상 수령
      parameters:
        - in: path
          name: mission_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimMissionResponse"

  /api/v2/mission/daily-gift:
    post:
      tags: [Mission]
      summary: 데일리 선물 수령
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimMissionResponse"

  /api/v2/mission/streak/rules:
    get:
      tags: [Mission]
      summary: 스트릭 규칙 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StreakRuleDto"

  /api/v2/mission/streak/claim:
    post:
      tags: [Mission]
      summary: 스트릭 보상 수령
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimStreakResponse"

  /api/v2/streak/status:
    get:
      tags: [Mission]
      summary: 스트릭 상태
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakInfoDto"

  # ============================================================================
  # Inventory
  # ============================================================================
  /api/v2/inventory:
    get:
      tags: [Inventory]
      summary: 인벤토리 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"

  /api/v2/inventory/items:
    get:
      tags: [Inventory]
      summary: 인벤토리 아이템 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"

  /api/v2/inventory/use:
    post:
      tags: [Inventory]
      summary: 인벤토리 아이템 사용
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUseRequest"
      responses:
        "200":
          description: OK

  # ============================================================================
  # Shop
  # ============================================================================
  /api/v2/shop/products:
    get:
      tags: [Shop]
      summary: 상점 상품 목록
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopProductDto"

  /api/v2/shop/purchase:
    post:
      tags: [Shop]
      summary: 상점 상품 구매
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopPurchaseRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopPurchaseResponse"

  # ============================================================================
  # TeamBattle
  # ============================================================================
  /api/v2/team-battle/seasons/active:
    get:
      tags: [TeamBattle]
      summary: 현재 시즌 조회
      responses:
        "200":
          description: OK

  /api/v2/team-battle/teams:
    get:
      tags: [TeamBattle]
      summary: 팀 목록
      responses:
        "200":
          description: OK

  /api/v2/team-battle/teams/join:
    post:
      tags: [TeamBattle]
      summary: 팀 가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamJoinRequest"
      responses:
        "200":
          description: OK

  /api/v2/team-battle/teams/leave:
    post:
      tags: [TeamBattle]
      summary: 팀 탈퇴
      responses:
        "200":
          description: OK

  /api/v2/team-battle/teams/me:
    get:
      tags: [TeamBattle]
      summary: 내 팀 정보
      responses:
        "200":
          description: OK

  /api/v2/team-battle/teams/leaderboard:
    get:
      tags: [TeamBattle]
      summary: 팀 리더보드
      responses:
        "200":
          description: OK

  /api/v2/team-battle/status:
    get:
      tags: [TeamBattle]
      summary: 팀 배틀 상태
      responses:
        "200":
          description: OK

  /api/v2/team-battle/rankings:
    get:
      tags: [TeamBattle]
      summary: 팀 배틀 랭킹
      responses:
        "200":
          description: OK

  /api/v2/team-battle/join:
    post:
      tags: [TeamBattle]
      summary: 팀 배틀 가입 (alias)
      responses:
        "200":
          description: OK

  # ============================================================================
  # Survey
  # ============================================================================
  /api/v2/surveys/active:
    get:
      tags: [Survey]
      summary: 활성 설문 조회
      responses:
        "200":
          description: OK

  /api/v2/surveys/{survey_id}/responses:
    post:
      tags: [Survey]
      summary: 설문 응답 생성
      parameters:
        - in: path
          name: survey_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK

  /api/v2/surveys/{survey_id}/responses/{response_id}:
    patch:
      tags: [Survey]
      summary: 설문 응답 수정
      parameters:
        - in: path
          name: survey_id
          required: true
          schema:
            type: integer
        - in: path
          name: response_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK

  /api/v2/surveys/{survey_id}/responses/{response_id}/complete:
    post:
      tags: [Survey]
      summary: 설문 응답 완료
      parameters:
        - in: path
          name: survey_id
          required: true
          schema:
            type: integer
        - in: path
          name: response_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  # ============================================================================
  # Feed
  # ============================================================================
  /api/v2/feed/list:
    get:
      tags: [Feed]
      summary: 피드 목록
      responses:
        "200":
          description: OK

  # ============================================================================
  # Inbox
  # ============================================================================
  /api/v2/inbox:
    get:
      tags: [Inbox]
      summary: 인박스 조회
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxListResponse"

  /api/v2/inbox/read:
    patch:
      tags: [Inbox]
      summary: 인박스 읽음 처리
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxReadRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxReadResponse"

  # ============================================================================
  # TicketZero
  # ============================================================================
  /api/v2/ticket-zero/status:
    get:
      tags: [TicketZero]
      summary: 티켓 제로 상태 조회
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketZeroStatusResponse"

  /api/v2/ticket-zero/bailout:
    post:
      tags: [TicketZero]
      summary: 티켓 제로 구조 요청
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketZeroBailoutResponse"

  # ============================================================================
  # Golden
  # ============================================================================
  /api/v2/golden/status:
    get:
      tags: [Golden]
      summary: 골든 상태
      responses:
        "200":
          description: OK

  /api/v2/golden/history:
    get:
      tags: [Golden]
      summary: 골든 히스토리
      responses:
        "200":
          description: OK

  /api/v2/golden/intervention/resolve:
    post:
      tags: [Golden]
      summary: 개입 결정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoldenInterventionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldenInterventionResponse"

  /api/v2/golden/reengagement/queue:
    post:
      tags: [Golden]
      summary: 재참여 큐
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoldenReengagementRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldenReengagementResponse"

  # ============================================================================
  # Telegram
  # ============================================================================
  /api/v2/telegram/auth:
    post:
      tags: [Telegram]
      summary: 텔레그램 연동
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuthRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramAuthResponse"

  /api/v2/telegram/link-token:
    post:
      tags: [Telegram]
      summary: 텔레그램 링크용 토큰 발급
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkTokenResponse"

  /api/v2/telegram/unlink-request:
    post:
      tags: [Telegram]
      summary: 텔레그램 연결 해제 요청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramUnlinkRequest"
      responses:
        "200":
          description: OK

  # ============================================================================
  # NewUser
  # ============================================================================
  /api/v2/new-user/status:
    get:
      tags: [NewUser]
      summary: 신규 유저 상태
      responses:
        "200":
          description: OK

  /api/v2/new-user/claim-welcome:
    post:
      tags: [NewUser]
      summary: 웰컴 보상 수령
      responses:
        "200":
          description: OK

  # ============================================================================
  # Activity
  # ============================================================================
  /api/v2/activity/record:
    post:
      tags: [Activity]
      summary: 활동 기록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRecordRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityRecordResponse"

  # ============================================================================
  # UI Config
  # ============================================================================
