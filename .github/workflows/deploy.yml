name: XMAS Event Fast Deployment

on:
    push:
        branches: [main] # main 브랜치에 푸시될 때 실행

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GH_TOKEN }}

            - name: Build and push Backend Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile.backend
                  push: true
                  tags: ghcr.io/${{ github.repository_owner }}/xmas-backend:latest

            - name: Build and push Frontend Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile.frontend
                  push: true
                  tags: ghcr.io/${{ github.repository_owner }}/xmas-frontend:latest

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to Vultr via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd /opt/xmas-event
                      docker compose pull
                      docker compose up -d --remove-orphans
                      docker image prune -f  # 오래된 이미지 정리
