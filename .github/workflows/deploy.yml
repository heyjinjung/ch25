name: XMAS Event Fast Deployment

on:
    push:
        branches: [main, temp-merge2] # main 및 현재 작업 브랜치에서 실행

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GH_TOKEN }}

            - name: Build and push Backend Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile.backend
                  push: true
                  tags: ghcr.io/${{ github.repository_owner }}/xmas-backend:latest

            - name: Build and push Frontend Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile.frontend
                  push: true
                  tags: ghcr.io/${{ github.repository_owner }}/xmas-frontend:latest

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to Vultr via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      mkdir -p /opt/xmas-event
                      cd /opt/xmas-event
                      # 여기에 docker-compose.yml 파일이 있어야 pull이 가능합니다.
                      # 초기에는 수동 또는 git pull로 파일을 가져와야 할 수 있습니다.
                      docker compose pull || echo "No docker-compose.yml found yet."
                      docker compose up -d --remove-orphans || echo "Deployment wait for config files."
                      docker image prune -f
