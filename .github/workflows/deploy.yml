name: XMAS Event Fast Deployment

on:
  push:
    branches: [main, temp-merge2]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/xmas-backend:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_ADMIN_API_URL=${{ vars.VITE_ADMIN_API_URL }}
          tags: ghcr.io/${{ github.repository_owner }}/xmas-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy config files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/*,scripts/init.sql"
          target: "/opt/xmas-event"

      - name: Deploy to Vultr via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_ACTOR,GH_TOKEN,JWT_SECRET,TELEGRAM_BOT_TOKEN,SECRET_KEY,TELEGRAM_BOT_USERNAME,TELEGRAM_CHANNEL_USERNAME
          script: |
            set -e
            # 깃허브 레지스트리 로그인
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            cd /opt/xmas-event

            # .env 파일 완전 자동 생성 (GitHub Secrets 기반)
            cat > .env << 'ENVEOF'
            DATABASE_URL=mysql+pymysql://xmasuser:2026@db:3306/xmas_event
            REDIS_URL=redis://redis:6379/0
            MYSQL_ROOT_PASSWORD=2026
            MYSQL_DATABASE=xmas_event
            MYSQL_USER=xmasuser
            MYSQL_PASSWORD=2026
            TZ=Asia/Seoul
            ENVEOF
            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> .env
            echo "SECRET_KEY=${SECRET_KEY}" >> .env
            echo "TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}" >> .env
            echo "TELEGRAM_CHANNEL_USERNAME=${TELEGRAM_CHANNEL_USERNAME}" >> .env
            echo "TELEGRAM_MINI_APP_URL=https://cc-jm.com" >> .env
            echo "TELEGRAM_WEBHOOK_URL=https://cc-jm.com" >> .env
            echo "ENVIRONMENT=production" >> .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
