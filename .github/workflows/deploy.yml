name: XMAS Event V2 Deployment

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/xmas-backend:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_URL=
            VITE_ADMIN_API_URL=
          tags: ghcr.io/${{ github.repository_owner }}/xmas-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH for SCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Copy config files via SCP
        run: |
          scp -r \
            docker-compose.yml \
            nginx \
            scripts/init.sql \
            Dockerfile.backend \
            Dockerfile.frontend \
            alembic.ini \
            alembic \
            root@${{ secrets.SERVER_IP }}:/opt/ch25

      - name: Deploy to Vultr via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: "30m"
          envs: GITHUB_ACTOR,GITHUB_SHA,GH_TOKEN,JWT_SECRET,TELEGRAM_BOT_TOKEN,SECRET_KEY,TELEGRAM_BOT_USERNAME,TELEGRAM_CHANNEL_USERNAME,SENTRY_DSN
          script: |
            set -e
            # 깃허브 레지스트리 로그인
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            cd /opt/ch25

            # Preflight: .env 존재 여부 기록(민감정보 출력 금지)
            if [ -f .env ]; then
              echo "[PRECHECK] .env exists"
              cp -f .env ".env.bak_${GITHUB_SHA}" || true
            else
              echo "[PRECHECK] .env missing"
            fi

            # .env 파일 완전 자동 생성 (GitHub Secrets 기반)
            cat > .env << 'ENVEOF'
            DATABASE_URL=mysql+pymysql://xmasuser:2026@db:3306/xmas_event
            REDIS_URL=redis://redis:6379/0
            MYSQL_ROOT_PASSWORD=2026
            MYSQL_DATABASE=xmas_event
            MYSQL_USER=xmasuser
            MYSQL_PASSWORD=2026
            TZ=Asia/Seoul
            ENV=production
            TEST_MODE=false
            DEV_LOGIN_ENABLED=false
            DOMAIN=cc-jm.com
            TIMEZONE=Asia/Seoul
            CORS_ORIGINS=["https://cc-jm.com","https://www.cc-jm.com","http://149.28.135.147"]
            CIRCUIT_LIMIT_VAULT=100000
            CIRCUIT_LIMIT_TICKET=30
            ENVEOF
            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}" >> .env
            echo "SECRET_KEY=${SECRET_KEY}" >> .env
            echo "TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}" >> .env
            echo "TELEGRAM_CHANNEL_USERNAME=${TELEGRAM_CHANNEL_USERNAME}" >> .env
            echo "SENTRY_DSN=${SENTRY_DSN}" >> .env
            echo "TELEGRAM_MINI_APP_URL=https://cc-jm.com" >> .env
            echo "TELEGRAM_WEBHOOK_URL=https://cc-jm.com" >> .env
            echo "ENVIRONMENT=production" >> .env

            # Gate(3.10): 운영 배포 전 DB 덤프/스냅샷
            mkdir -p backups/db
            export DEPLOY_SHA="${GITHUB_SHA}"
            export DUMP_BASENAME="backups/db/xmas_event_${DEPLOY_SHA}_$(date +%Y%m%d_%H%M%S).sql"

            # DB가 떠있지 않으면 최소 기동
            docker compose up -d db

            # DB readiness (최대 90초)
            i=0
            until docker compose exec -T db sh -lc 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent' >/dev/null 2>&1; do
              i=$((i+1))
              if [ "$i" -ge 45 ]; then
                echo "[DUMP] DB not ready (timeout)" >&2
                exit 1
              fi
              sleep 2
            done

            echo "[DUMP] Creating dump: ${DUMP_BASENAME}"
            DUMP_OK=0
            for USERPASS in "root:${MYSQL_ROOT_PASSWORD}" "${MYSQL_USER}:${MYSQL_PASSWORD}"; do
              USERNAME="${USERPASS%%:*}"
              PASS="${USERPASS#*:}"
              if [ -z "$USERNAME" ] || [ -z "$PASS" ]; then
                continue
              fi
              if docker compose exec -T db sh -lc "mysqldump -u\"${USERNAME}\" -p\"${PASS}\" --single-transaction --routines --triggers \"${MYSQL_DATABASE}\"" > "${DUMP_BASENAME}"; then
                DUMP_OK=1
                break
              else
                echo "[DUMP] failed for user=${USERNAME}" >&2
              fi
            done

            if [ "$DUMP_OK" -ne 1 ]; then
              echo "[DUMP] dump failed; continue without backup" >&2
              rm -f "${DUMP_BASENAME}" || true
            else
              if [ ! -s "${DUMP_BASENAME}" ]; then
                echo "[DUMP] Dump file is empty (0 bytes)" >&2
                ls -lh "${DUMP_BASENAME}" || true
                exit 1
              fi

              if command -v gzip >/dev/null 2>&1; then
                gzip -f "${DUMP_BASENAME}"
                export DUMP_PATH="${DUMP_BASENAME}.gz"
              else
                export DUMP_PATH="${DUMP_BASENAME}"
              fi

              ls -lh "${DUMP_PATH}"
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "${DUMP_PATH}" | tee -a backups/db/SHA256SUMS.txt
              else
                echo "[DUMP] sha256sum not found; skipped" >&2
              fi
            fi

            # 이미지 pull (최대 3회 재시도)
            pull_try=0
            until docker compose pull; do
              pull_try=$((pull_try+1))
              if [ "$pull_try" -ge 3 ]; then
                echo "[PULL] docker compose pull failed" >&2
                exit 1
              fi
              sleep 5
            done
            docker compose up -d --remove-orphans

            # [2026-02-01] 백엔드 컨테이너가 완전히 시작될 때까지 대기
            # 원인: 컨테이너가 "restarting" 상태일 때 exec 명령 실패
            echo "[WAIT] Waiting for backend container to be running..."
            backend_wait=0
            until docker compose ps backend --format '{{.State}}' 2>/dev/null | grep -q "running"; do
              backend_wait=$((backend_wait+1))
              if [ "$backend_wait" -ge 30 ]; then
                echo "[WAIT] Backend container failed to start" >&2
                docker compose logs --tail=100 backend || true
                exit 1
              fi
              echo "[WAIT] Backend not ready yet, waiting... (${backend_wait}/30)"
              sleep 2
            done
            echo "[WAIT] Backend container is running"

            # [2026-02-01] 502 Bad Gateway 방지: 백엔드 컨테이너 재시작 후 Nginx DNS 캐시 불일치 해결
            # 원인: Docker 네트워크에서 컨테이너 IP가 변경되면 Nginx가 이전 IP로 계속 연결 시도
            # 참조: docs/v2_specs/90_troubleshooting/W05_INFRA_troubleshooting.md
            echo "[NGINX] Restarting nginx to refresh DNS cache (prevent 502)..."
            sleep 3
            docker compose restart nginx || true
            sleep 2

            # Gate(3.5/3.8): 마이그레이션 (최대 5회 재시도, 대기시간 증가)
            echo "[MIGRATION] Running alembic upgrade head..."
            mig_try=0
            until docker compose exec -T backend alembic upgrade head; do
              mig_try=$((mig_try+1))
              if [ "$mig_try" -ge 5 ]; then
                echo "[MIGRATION] alembic upgrade head failed after 5 attempts" >&2
                docker compose exec -T backend alembic current || true
                docker compose exec -T backend alembic heads || true
                exit 1
              fi
              echo "[MIGRATION] retrying (${mig_try}/5)" >&2
              sleep $((5 + mig_try * 2))
            done
            docker compose exec -T backend alembic current
            docker compose exec -T backend alembic heads

            # Gate(3.6): 헬스 체크
            # 1) backend 자체가 준비됐는지 먼저 확인(nginx 영향 제거)
            echo "[HEALTH] waiting backend container /api/v2/health"
            k=0
            until docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health', timeout=2).read()" >/dev/null 2>&1; do
              k=$((k+1))
              if [ "$k" -ge 45 ]; then
                echo "[HEALTH] backend container /api/v2/health failed" >&2
                docker compose logs --tail=200 backend || true
                exit 1
              fi
              sleep 2
            done

            echo "[HEALTH] waiting backend container /api/v2/health/db"
            k=0
            until docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health/db', timeout=2).read()" >/dev/null 2>&1; do
              k=$((k+1))
              if [ "$k" -ge 45 ]; then
                echo "[HEALTH] backend container /api/v2/health/db failed" >&2
                docker compose logs --tail=200 backend || true
                exit 1
              fi
              sleep 2
            done

            # 2) nginx 경유 라우팅 확인
            echo "[HEALTH] waiting nginx /health"
            j=0
            until curl -fsS http://127.0.0.1/health >/dev/null 2>&1; do
              j=$((j+1))
              if [ "$j" -ge 45 ]; then
                echo "[HEALTH] /health failed" >&2
                docker compose logs --tail=200 nginx || true
                exit 1
              fi
              sleep 2
            done

            echo "[HEALTH] waiting nginx /api/v2/health"
            a=0
            API_CODE=""
            until [ "$API_CODE" = "200" ]; do
              API_CODE=$(curl -sS -D /tmp/api_headers.txt -o /tmp/api_body.txt -w "%{http_code}" http://127.0.0.1/api/v2/health || true)
              if [ "$API_CODE" = "200" ]; then
                break
              fi
              a=$((a+1))
              if [ "$a" -ge 45 ]; then
                echo "[HEALTH] /api/v2/health failed (last HTTP ${API_CODE})" >&2
                head -n 30 /tmp/api_headers.txt || true
                head -n 30 /tmp/api_body.txt || true
                docker compose logs --tail=200 nginx || true
                docker compose logs --tail=200 backend || true
                exit 1
              fi
              sleep 2
            done

            echo "[HEALTH] waiting nginx /api/v2/health/db"
            b=0
            DB_CODE=""
            until [ "$DB_CODE" = "200" ]; do
              DB_CODE=$(curl -sS -D /tmp/db_headers.txt -o /tmp/db_body.txt -w "%{http_code}" http://127.0.0.1/api/v2/health/db || true)
              if [ "$DB_CODE" = "200" ]; then
                break
              fi
              b=$((b+1))
              if [ "$b" -ge 45 ]; then
                echo "[HEALTH] /api/v2/health/db failed (last HTTP ${DB_CODE})" >&2
                head -n 30 /tmp/db_headers.txt || true
                head -n 30 /tmp/db_body.txt || true
                docker compose logs --tail=200 nginx || true
                docker compose logs --tail=200 backend || true
                exit 1
              fi
              sleep 2
            done

            # Gate(3.9 최소 자동화): V2 Admin API JSON 응답 확인
            ADMIN_URL="http://127.0.0.1/api/v2/admin/ui-config/streak_reward_rules"
            ADMIN_CODE=$(curl -sS -D /tmp/admin_headers.txt -o /tmp/admin_body.txt -w "%{http_code}" "$ADMIN_URL" || true)
            # NOTE: admin ui-config는 PUT만 인증 필요. GET은 현재 public이지만,
            #       nginx/라우팅이 깨지면 HTML(index.html)로 떨어지는 사고를 잡는 목적이므로
            #       200(JSON) 또는 401(JSON, AUTH_REQUIRED)을 정상으로 본다.
            if [ "$ADMIN_CODE" != "200" ] && [ "$ADMIN_CODE" != "401" ]; then
              echo "[ADMIN] Smoke failed: HTTP ${ADMIN_CODE}" >&2
              head -n 30 /tmp/admin_headers.txt || true
              head -n 30 /tmp/admin_body.txt || true
              exit 1
            fi
            if ! grep -i '^content-type:.*application/json' /tmp/admin_headers.txt >/dev/null 2>&1; then
              echo "[ADMIN] Smoke failed: non-JSON response" >&2
              head -n 30 /tmp/admin_headers.txt || true
              head -n 30 /tmp/admin_body.txt || true
              exit 1
            fi
            if [ "$ADMIN_CODE" = "401" ] && ! grep -q 'AUTH_REQUIRED' /tmp/admin_body.txt >/dev/null 2>&1; then
              echo "[ADMIN] Smoke failed: unexpected 401 body" >&2
              head -n 30 /tmp/admin_body.txt ||true
              exit 1
            fi

            # 배포 기록(5.6)
            echo "${GITHUB_SHA}" > DEPLOYED_SHA
            echo "[OK] DEPLOYED_SHA=$(cat DEPLOYED_SHA)"
