services:
  # Database
  db:
    image: mysql:8.0
    container_name: xmas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xmas_event}
      MYSQL_USER: ${MYSQL_USER:-xmasuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-2026}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    networks:
      - xmas-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: xmas-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    networks:
      - xmas-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    image: ghcr.io/heyjinjung/xmas-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xmas-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-xmasuser}:${MYSQL_PASSWORD:-xmaspass}@db:3306/${MYSQL_DATABASE:-xmas_event}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Seoul
      TEAM_BATTLE_POINTS_PER_PLAY: ${TEAM_BATTLE_POINTS_PER_PLAY:-10}
      TEAM_BATTLE_DAILY_PLAY_CAP: ${TEAM_BATTLE_DAILY_PLAY_CAP:-500}
      # Unified Economy / Vault accrual flags (production defaults; override via .env if needed)
      ENABLE_VAULT_GAME_EARN_EVENTS: ${ENABLE_VAULT_GAME_EARN_EVENTS:-true}
      ENABLE_TRIAL_PAYOUT_TO_VAULT: ${ENABLE_TRIAL_PAYOUT_TO_VAULT:-true}
      STREAK_MILESTONE_REWARDS_ENABLED: ${STREAK_MILESTONE_REWARDS_ENABLED:-true}
      XP_FROM_GAME_REWARD: "false"
      # Rate Limiting (높은 값으로 설정하여 로컬 테스트 방해 방지)
      GOLDEN_HOUR_CLAIM_RATE_RPS: "1000"
      GOLDEN_HOUR_CLAIM_RATE_BURST: "2000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - xmas-network
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./docs:/app/docs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]

  # Celery Worker
  celery-worker:
    image: ghcr.io/heyjinjung/xmas-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xmas-celery-worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-xmasuser}:${MYSQL_PASSWORD:-xmaspass}@db:3306/${MYSQL_DATABASE:-xmas_event}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xmas-network
    volumes:
      - ./app:/app/app

  # Celery Beat (Scheduler)
  celery-beat:
    image: ghcr.io/heyjinjung/xmas-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xmas-celery-beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-xmasuser}:${MYSQL_PASSWORD:-xmaspass}@db:3306/${MYSQL_DATABASE:-xmas_event}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xmas-network
    volumes:
      - ./app:/app/app

  # Frontend
  frontend:
    image: ghcr.io/heyjinjung/xmas-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # IMPORTANT: Do not default to http://localhost:8000 here.
        # In production, the browser's localhost is the user's machine, not the server.
        # Prefer empty (so frontend derives same-origin) and rely on nginx proxy (/api, /admin/api).
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-}
        VITE_ADMIN_API_TIMEOUT_MS: ${VITE_ADMIN_API_TIMEOUT_MS:-}
        # Telegram deep-link UI (hardcode 제거). 운영은 기본값 유지, 로컬은 .env로 override.
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-jm956_bot}
        VITE_TELEGRAM_WEBAPP_SHORT_NAME: ${VITE_TELEGRAM_WEBAPP_SHORT_NAME:-ccjm}
        VITE_ENV: production
    container_name: xmas-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      - "3000:80"
    networks:
      - xmas-network
    depends_on:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: xmas-nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - xmas-network

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: xmas-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - xmas-network

  # Telegram Bot
  telegram_bot:
    image: ghcr.io/heyjinjung/xmas-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xmas-telegram-bot
    restart: on-failure
    command: python -m app.bot.main
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-xmasuser}:${MYSQL_PASSWORD:-xmaspass}@db:3306/${MYSQL_DATABASE:-xmas_event}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Seoul
      TEAM_BATTLE_POINTS_PER_PLAY: ${TEAM_BATTLE_POINTS_PER_PLAY:-10}
      TEAM_BATTLE_DAILY_PLAY_CAP: ${TEAM_BATTLE_DAILY_PLAY_CAP:-500}
      # Keep bot behavior consistent with backend in production
      ENABLE_VAULT_GAME_EARN_EVENTS: ${ENABLE_VAULT_GAME_EARN_EVENTS:-true}
      ENABLE_TRIAL_PAYOUT_TO_VAULT: ${ENABLE_TRIAL_PAYOUT_TO_VAULT:-true}
      STREAK_MILESTONE_REWARDS_ENABLED: ${STREAK_MILESTONE_REWARDS_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xmas-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      disable: true

networks:
  xmas-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
